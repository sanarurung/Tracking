name: iPhone build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: DriveMeter
    env:
      NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Unpack the reviewed source project
        working-directory: .
        run: python3 -m zipfile -e DriveMeter-iPhone.zip .

      - name: Test history persistence and motion fusion
        run: swift test --parallel

      - name: Configure Naver Maps
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NAVER_MAPS_CLIENT_ID" ]; then
            echo "::error::Add the NAVER_MAPS_CLIENT_ID repository secret before building."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :NMFNcpKeyId $NAVER_MAPS_CLIENT_ID" DriveMeter/Info.plist

      - name: Archive for iPhone without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DriveMeter.xcodeproj -scheme DriveMeter \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          mkdir -p build/unsigned/Payload
          ditto build/Unsigned.xcarchive/Products/Applications/DriveMeter.app build/unsigned/Payload/DriveMeter.app
          cd build/unsigned
          zip -qry ../DriveMeter-unsigned.ipa Payload

      - name: Upload unsigned IPA (requires signing before installation)
        uses: actions/upload-artifact@v4
        with:
          name: DriveMeter-unsigned-needs-signing
          path: DriveMeter/build/DriveMeter-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Check signing configuration
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_WIDGET_PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BUILD_CERTIFICATE_BASE64" && -n "$P12_PASSWORD" && -n "$BUILD_PROVISION_PROFILE_BASE64" && -n "$BUILD_WIDGET_PROVISION_PROFILE_BASE64" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Unsigned IPA built. Installable IPA still needs Apple Distribution P12 + password + app + widget Ad Hoc provisioning profiles. See CLOUD-BUILD.md.'
            echo '### Signing required' >> "$GITHUB_STEP_SUMMARY"
            echo 'The unsigned IPA cannot be installed as downloaded. Configure the four repository secrets in CLOUD-BUILD.md and rerun to produce the signed IPA.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build signed Ad Hoc IPA
        if: steps.signing.outputs.ready == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_WIDGET_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/build-signed-ipa.sh

      - name: Upload installable Ad Hoc IPA
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DriveMeter-signed-registered-iPhones
          path: DriveMeter/build/signed/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-test-diagnostics
          path: DriveMeter/build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
