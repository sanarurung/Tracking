name: iPhone build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the existing nine tests on iOS 27 before archiving
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: DriveMeter
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Unpack the reviewed source project
        working-directory: .
        run: python3 -m zipfile -e DriveMeter-iPhone.zip .

      - name: Select an available iPhone simulator
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as stream:
              devices = json.load(stream)['devices']
          phones = [d for runtime, items in devices.items() if 'iOS-27-' in runtime
                    for d in items if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator on this runner')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('udid=' + phones[0]['udid'] + '\n')
          PY

      - name: Compile and run fare and inertial tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcodebuild -project DriveMeter.xcodeproj -scheme DriveMeter \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test

      - name: Archive for iPhone without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DriveMeter.xcodeproj -scheme DriveMeter \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          mkdir -p build/unsigned/Payload
          ditto build/Unsigned.xcarchive/Products/Applications/DriveMeter.app build/unsigned/Payload/DriveMeter.app
          cd build/unsigned
          zip -qry ../DriveMeter-unsigned.ipa Payload

      - name: Upload unsigned IPA (requires signing before installation)
        uses: actions/upload-artifact@v4
        with:
          name: DriveMeter-unsigned-needs-signing
          path: DriveMeter/build/DriveMeter-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Check signing configuration
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BUILD_CERTIFICATE_BASE64" && -n "$P12_PASSWORD" && -n "$BUILD_PROVISION_PROFILE_BASE64" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Unsigned IPA built. Installable IPA still needs Apple Distribution P12 + password + Ad Hoc provisioning profile. See CLOUD-BUILD.md.'
            echo '### Signing required' >> "$GITHUB_STEP_SUMMARY"
            echo 'The unsigned IPA cannot be installed as downloaded. Configure the three repository secrets in CLOUD-BUILD.md and rerun to produce the signed IPA.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build signed Ad Hoc IPA
        if: steps.signing.outputs.ready == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/build-signed-ipa.sh

      - name: Upload installable Ad Hoc IPA
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DriveMeter-signed-registered-iPhones
          path: DriveMeter/build/signed/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-test-diagnostics
          path: DriveMeter/build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
